name: Update route list
on:
  push:
    paths:
      - 'routes/*.gpx'
      - 'scripts/build-routes.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build-routes.mjs
      - name: Commit routes.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/routes.json
          git diff --staged --quiet || (git commit -m "Update routes.json" && git push)
